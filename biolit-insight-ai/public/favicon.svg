<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="med-lens">
      <circle cx="13" cy="13" r="7.5"/>
    </clipPath>
  </defs>

  <!-- Deep Aubergine Rounded Square Background -->
  <rect width="32" height="32" rx="7" fill="#3A0F34"/>

  <!-- Lens Glass Fill -->
  <circle cx="13" cy="13" r="7.5" fill="rgba(244, 240, 232, 0.12)"/>

  <!-- Lens Outer Ring in Warm Ivory -->
  <circle cx="13" cy="13" r="7.5" stroke="#FAF8F5" stroke-width="1.8" fill="none"/>

  <!-- Marigold Yellow ECG Pulse -->
  <g clip-path="url(#med-lens)">
    <polyline
      points="4.5,13 8.5,13 9.6,7.5 11.2,18.5 12.5,10 13.5,13 21.5,13"
      stroke="#EAAA00"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- Lens Handle -->
  <line x1="18.5" y1="18.5" x2="26" y2="26" stroke="#FAF8F5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Marigold Peak Insight Dot -->
  <circle cx="9.6" cy="7.5" r="1.3" fill="#EAAA00"/>
</svg>
